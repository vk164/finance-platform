services:
  postgres:
    image: postgres:18
    restart: unless-stopped

    environment:
      POSTGRES_USER: transactions
      POSTGRES_PASSWORD: transactions_dev
      POSTGRES_DB: transactions_db

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U transactions -d transactions_db
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
