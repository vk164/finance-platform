[project]
name = "transactions-srv"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.159.1",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transactions"]
